    <title>Qwasm</title>
    <style>body{background-color:#202020;color:#e0e0e0;font-family:Arial,Helvetica,sans-serif;font-size:16px;margin:0;text-align:center}a{color:inherit}code{font-size:inherit}input,button,select{font-family:inherit;font-size:inherit}table{border:1px;border-style:dashed}td{padding:2px}.textInfo{margin:8px}.cbCustom{width:16px;height:16px}#statusContainer{display:none}figure{overflow:visible}.spinner{height:50px;width:50px;margin:0 auto;animation:rotation .8s linear infinite;border-left:10px solid #606060;border-right:10px solid #606060;border-bottom:10px solid #606060;border-top:10px solid #fff;border-radius:100%}progress{width:250px;height:20px}textarea{margin-left:auto;margin-right:auto;font-family:monospace;font-size:14px;color:#ccc;border:1px solid #444;width:calc(100% - 24px);height:calc(100vh - 24px);margin-top:8px;background-color:inherit;resize:none;outline:none;display:none}canvas{border:0;background-color:#000;width:calc(min(100vw,100vh * 4/3));height:calc(min(100vh,100vw * 0.75));margin-top:calc(0.5 * (100vh - (min(100vh,100vw * 0.75))));margin-left:auto;margin-right:auto;outline:none;display:none}@keyframes rotation{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style></head><body><div id=headerContainer class=textInfo><h1>Qwasm</h1></div><div id=startContainer class=textInfo><p><input type=file id=pakFiles multiple><p><button id=startButtonQ style=width:160px;height:32px;margin-top:6px>Start Quake</button></div><div id=statusContainer class=textInfo><figure><div class=spinner></div></figure><div id=status>Starting...</div><progress value=0 max=100 id=progress hidden></progress></div><canvas id=canvas oncontextmenu=event.preventDefault(); tabindex=-1></canvas>

  };
</script>
