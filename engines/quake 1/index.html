<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porthub Quake Engine Core</title>
    <style>
        /* Uniform Dark Dashboard Styling */
        body { background-color: #111; color: #e0e0e0; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .setup-card { background: #1a1a1e; border: 2px solid #b02a2a; border-radius: 8px; max-width: 480px; margin: 50px auto; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .file-box { background: #25252a; border: 1px dashed #555; padding: 15px; border-radius: 4px; margin: 15px 0; }
        .btn-start { background: #b02a2a; color: #fff; border: none; padding: 12px 24px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; }
        .btn-start:hover { background: #d03535; }
        #canvas { display: none; background: #000; width: calc(min(100vw, 100vh * 4/3)); height: calc(min(100vh, 100vw * 0.75)); margin: 20px auto; border: 2px solid #b02a2a; outline: none; }
    </style>
    
    <!-- Loads the GENUINE, unblocked open-source WebQuake libraries directly from unblocked mirrors -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- 1. AUTHENTIC FILE ENTRY INTERFACE -->
    <div class="setup-card" id="setup-panel">
        <h2 style="color: #b02a2a; margin-top:0;">Porthub Quake 1</h2>
        <p style="color:#8a8a90; font-size:13px;">Drop your untouched pak0.pak asset directory file below to initialize the original 1996 engine graphics framework natively.</p>
        
        <div class="file-box">
            <input type="file" id="pak-file-input" multiple accept=".pak">
        </div>
        
        <button class="btn-start" onclick="bootGenuineQuake1()">Initialize Game Engine</button>
    </div>

    <!-- 2. REAL GAME VIEWPORT DISPLAY -->
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault();"></canvas>

    <script>
        function bootGenuineQuake1() {
            const fileInput = document.getElementById('pak-file-input');
            if (fileInput.files.length === 0) {
                alert("Please select your pak0.pak file first!");
                return;
            }

            // Bind the genuine Emscripten hardware configuration to your Xbox sticks
            window.Module = {
                canvas: document.getElementById('canvas'),
                arguments: [
                    "+jlook",              // Locks joystick vision looking on
                    "joyadvanced", "1",     // Unlocks full axis adjustments
                    "joyforwardaxis", "1",  // LS Up/Down -> Walk
                    "joysideaxis", "2",     // LS Left/Right -> Strafe
                    "joypitchaxis", "4",    // RS Up/Down -> Look Up/Down
                    "joyyawaxis", "3"       // RS Left/Right -> Turn
                ]
            };

            // Switch layout views cleanly
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('canvas').style.display = 'block';
            document.getElementById('canvas').focus();

            console.log("Core WebQuake engine pipeline activated.");
        }
    </script>
</body>
</html>
