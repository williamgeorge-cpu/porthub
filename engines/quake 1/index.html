<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porthub 3D Engine Room</title>
    <style>
        body { background-color: #111; color: #fff; font-family: monospace; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        #canvas { background: #000; width: calc(min(100vw, 100vh * 4/3)); height: calc(min(100vh, 100vw * 0.75)); max-width: 800px; max-height: 600px; border: 2px solid #b02a2a; border-radius: 6px; display: block; margin: 10px auto; outline: none; }
        .ui-panel { background: #1a1a1e; border: 1px solid #444; padding: 10px; max-width: 780px; margin: 0 auto; border-radius: 4px; font-size: 12px; text-align: left; }
    </style>
</head>
<body>

    <canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>

    <div class="ui-panel">
        <strong style="color: #b02a2a;">PORTHUB 3D NATIVE CORE RUNTIME</strong> | 
        <span>Left Stick: Move/Strafe</span> | 
        <span>Right Stick: Look Around</span>
        <div id="gamepad-status" style="color: #00ff00; margin-top: 5px;">Searching for Xbox Controller Input...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 3D Player State
        let playerX = 3.5;
        let playerY = 3.5;
        let playerAngle = 0;

        // Built-in 3D Level Map Grid (1 = Wall, 0 = Empty Space)
        const mapSize = 8;
        const map = [,
 ,
 ,
 ,
 ,
 ,
 ,
            [1,1,1,1,1,1,1,1]
        ];

        // Core 3D Raycasting Engine Logic
        function render3DScene() {
            // 1. Draw Ceiling and Floor Backgrounds
            ctx.fillStyle = "#222"; // Ceiling
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            ctx.fillStyle = "#151515"; // Floor
            ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

            const fov = 60 * (Math.PI / 180);
            const numRays = canvas.width;
            const halfFov = fov / 2;

            // 2. Cast a Light Ray for Every Vertical Column on the Screen
            for (let i = 0; i < numRays; i++) {
                let rayAngle = (playerAngle - halfFov) + (i / numRays) * fov;
                let distanceToWall = 0;
                let hitWall = false;

                let eyeX = Math.cos(rayAngle);
                let eyeY = Math.sin(rayAngle);

                while (!hitWall && distanceToWall < 16) {
                    distanceToWall += 0.05;
                    let testX = Math.floor(playerX + eyeX * distanceToWall);
                    let testY = Math.floor(playerY + eyeY * distanceToWall);

                    if (testX < 0 || testX >= mapSize || testY < 0 || testY >= mapSize) {
                        hitWall = true;
                        distanceToWall = 16;
                    } else if (map[testY][testX] > 0) {
                        hitWall = true;
                    }
                }

                // Correct Fish-eye lens distortion
                let correctedDistance = distanceToWall * Math.cos(rayAngle - playerAngle);

                // Calculate Wall Height based on distance
                let wallHeight = Math.min(canvas.height, canvas.height / correctedDistance);

                // Calculate Shading (Further walls appear darker)
                let colorIntensity = Math.max(20, 180 - (correctedDistance * 12));
                ctx.fillStyle = `rgb(${colorIntensity}, ${colorIntensity * 0.2}, ${colorIntensity * 0.2})`;

                // Draw the vertical wall slice
                ctx.fillRect(i, (canvas.height / 2) - (wallHeight / 2), 1, wallHeight);
            }
        }

        // Native Xbox Controller Input Polling System
        function pollHardwareInput() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const xbox = gamepads[0];
            const statusDiv = document.getElementById('gamepad-status');

            if (xbox) {
                statusDiv.innerText = `🎮 Xbox Controller Connected: ${xbox.id}`;
                statusDiv.style.color = "#00ff00";

                const deadzone = 0.2;

                // Left Stick Vertical Axis (Move Forward/Backward)
                if (Math.abs(xbox.axes[1]) > deadzone) {
                    let moveX = playerX + Math.cos(playerAngle) * (-xbox.axes[1] * 0.05);
                    let moveY = playerY + Math.sin(playerAngle) * (-xbox.axes[1] * 0.05);
                    if (map[Math.floor(playerY)][Math.floor(moveX)] === 0) playerX = moveX;
                    if (map[Math.floor(moveY)][Math.floor(playerX)] === 0) playerY = moveY;
                }

                // Left Stick Horizontal Axis (Strafe Left/Right)
                if (Math.abs(xbox.axes[0]) > deadzone) {
                    let strafeX = playerX + Math.cos(playerAngle + Math.PI / 2) * (xbox.axes[0] * 0.04);
                    let strafeY = playerY + Math.sin(playerAngle + Math.PI / 2) * (xbox.axes[0] * 0.04);
                    if (map[Math.floor(playerY)][Math.floor(strafeX)] === 0) playerX = strafeX;
                    if (map[Math.floor(strafeY)][Math.floor(playerX)] === 0) playerY = strafeY;
                }

                // Right Stick Horizontal Axis (Turn Camera Left/Right)
                if (Math.abs(xbox.axes[2]) > deadzone) {
                    playerAngle += xbox.axes[2] * 0.04;
                }
            } else {
                statusDiv.innerText = "🔌 Searching for Xbox Controller... Press any button to pair.";
                statusDiv.style.color = "#ffaa00";
            }
        }

        // Master Frame Loop Sequence
        function engineTick() {
            pollHardwareInput();
            render3DScene();
            requestAnimationFrame(engineTick);
        }

        // Initialize Engine
        canvas.focus();
        engineTick();
    </script>
</body>
</html>
