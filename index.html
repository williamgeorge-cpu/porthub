// Paste this updated script inside your main Porthub dashboard wrapper file
<script>
        function exportPorthubSave() {
    var databases = ['/idbfs', 'EmscriptenFS', 'hollow_knight'];
    var found = false;
    var downloadedKeys = []; // 💡 Tracker array to prevent infinite download spam

    databases.forEach(function(dbName) {
        var request = indexedDB.open(dbName);
        request.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('FILE_DATA')) return;
            
            db.transaction('FILE_DATA','readonly').objectStore('FILE_DATA').openCursor().onsuccess = function(evt) {
                var cursor = evt.target.result;
                if (cursor) {
                    // Check if file criteria match and make sure we haven't downloaded it already
                    if ((cursor.key.includes('user') || cursor.key.includes('.dat')) && !downloadedKeys.includes(cursor.key)) {
                        found = true;
                        downloadedKeys.push(cursor.key); // Lock key into tracker memory
                        
                        var rawData = cursor.value.contents ? cursor.value.contents : cursor.value;
                        var blob = new Blob([new Uint8Array(rawData)], {type: "application/octet-stream"});
                        var link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        
                        // Dynamically names file based on engine context (e.g., user1.dat.pHubSave)
                        link.download = cursor.key.replace('/', '') + ".pHubSave";
                        link.click();
                    }
                    cursor.continue(); // Continues scanning for OTHER games safely
                }
            };
        };
    });
    
    setTimeout(function() { 
        if(!found) alert("No save data found yet. Try entering the game, saving somewhere, and trying again."); 
        else alert("Success! Your unique game saves have been compiled.");
    }, 1000);
}
</script>

        <script>
document.addEventListener('keydown', function(event) {
    if (event.key === 'F11' || event.code === 'F11') {
        if (!document.fullscreenElement) {
            triggerTrueBorderless();
        }
    }
});

window.addEventListener('resize', function() {
    if (window.outerWidth === screen.width && window.outerHeight === screen.height) {
        if (!document.fullscreenElement) {
            triggerTrueBorderless();
        }
    }
});

function triggerTrueBorderless() {
    var elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log(err));
    } else if (elem.webkitRequestFullscreen) { 
        elem.webkitRequestFullscreen();
    }
}
</script>
        
<script>


    // Verification patch for your main dashboard script
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then((isPersisted) => {
    const statusDiv = document.getElementById("storage-status");
    
    if (isPersisted) {
      statusDiv.innerText = "Saves Protected (ChromeOS Wipes Blocked)";
      statusDiv.style.color = "#00ff00"; // Green color
    } else {
      // If it's not active yet, request it natively
      navigator.storage.persist().then((granted) => {
        if (granted) {
          statusDiv.innerText = "Saves Protected (ChromeOS Wipes Blocked)";
          statusDiv.style.color = "#00ff00";
        } else {
          statusDiv.innerText = "Saves Vulnerable (Managed Profile Restriction)";
          statusDiv.style.color = "#ff3333"; // Red color
        }
      });
    }
  });
}

</script>
<!-- PORTHUB DESKTOP CANVAS HARDWARE KEY INJECTOR -->
<script>
    (function() {
        // Map stick directions directly to standard Quake keyboard key commands
        // A/D handles turning; for vertical looking, we simulate standard keys
        const CONTROLLER_KEYS = {
            up: { key: 'PageUp', code: 'PageUp', keyCode: 33 },
            down: { key: 'PageDown', code: 'PageDown', keyCode: 34 },
            left: { key: 'a', code: 'KeyA', keyCode: 65 },
            right: { key: 'd', code: 'KeyD', keyCode: 68 }
        };

        let activeKeys = {};

        function dispatchHardwareKey(config, isPressed) {
            const code = config.code;
            if (activeKeys[code] === isPressed) return;
            activeKeys[code] = isPressed;

            const targetElement = document.getElementById('canvas') || window;
            const eventType = isPressed ? 'keydown' : 'keyup';
            
            // Build a heavy, structured event that passes directly into Emscripten's native event catcher
            const ev = new KeyboardEvent(eventType, {
                key: config.key,
                code: config.code,
                keyCode: config.keyCode,
                which: config.keyCode,
                bubbles: true,
                cancelable: true,
                view: window
            });

            targetElement.dispatchEvent(ev);
        }

        function pollXboxHardwareBridge() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = gamepads[0]; // Primary connected Xbox controller

            if (pad) {
                // XInput Standard: Axis 2 = Right Stick Horizontal, Axis 3 = Right Stick Vertical
                const stickX = pad.axes[2];
                const stickY = pad.axes[3];
                const deadzone = 0.25; // Block stick drift calibration

                // Horizontal Axis (Turning)
                dispatchHardwareKey(CONTROLLER_KEYS.right, stickX > deadzone);
                dispatchHardwareKey(CONTROLLER_KEYS.left, stickX < -deadzone);

                // Vertical Axis (Looking Up/Down)
                dispatchHardwareKey(CONTROLLER_KEYS.down, stickY > deadzone);
                dispatchHardwareKey(CONTROLLER_KEYS.up, stickY < -deadzone);
            }
            requestAnimationFrame(pollXboxHardwareBridge);
        }

        requestAnimationFrame(pollXboxHardwareBridge);
    })();
</script>

            <!-- Put this in your root Porthub index file to control Quake games remotely -->
<script>
    (function() {
        // Map stick directions directly to traditional Quake controls
        const TARGET_KEYS = {
            up: { key: 'PageUp', code: 'PageUp', keyCode: 33 },
            down: { key: 'PageDown', code: 'PageDown', keyCode: 34 },
            left: { key: 'a', code: 'KeyA', keyCode: 65 },
            right: { key: 'd', code: 'KeyD', keyCode: 68 }
        };

        let activeKeys = {};

        function sendKeyToGame(config, isPressed) {
            const code = config.code;
            if (activeKeys[code] === isPressed) return;
            activeKeys[code] = isPressed;

            // Target the active game window context
            // Change 'gameFrame' to match your dashboard iframe ID if you use one
            const frame = document.getElementById('gameFrame');
            const targetWindow = frame ? frame.contentWindow : window;
            const eventType = isPressed ? 'keydown' : 'keyup';

            const ev = new KeyboardEvent(eventType, {
                key: config.key,
                code: config.code,
                keyCode: config.keyCode,
                which: config.keyCode,
                bubbles: true,
                cancelable: true
            });

            targetWindow.dispatchEvent(ev);
        }

        function pollDashboardXboxBridge() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = gamepads[0]; // Xbox controller slot

            if (pad) {
                const stickX = pad.axes[2]; // Right Stick X
                const stickY = pad.axes[3]; // Right Stick Y
                const deadzone = 0.25;

                // Fire horizontal turning and vertical aiming directly through the frame
                sendKeyToGame(TARGET_KEYS.right, stickX > deadzone);
                sendKeyToGame(TARGET_KEYS.left, stickX < -deadzone);
                sendKeyToGame(TARGET_KEYS.down, stickY > deadzone);
                sendKeyToGame(TARGET_KEYS.up, stickY < -deadzone);
            }
            requestAnimationFrame(pollDashboardXboxBridge);
        }

        requestAnimationFrame(pollDashboardXboxBridge);
    })();
</script>
