    <!-- EXPORT SECTION -->
    <button style="background:#b02a2a; color:#fff; border:none; padding:10px 15px; font-weight:bold; cursor:pointer; border-radius:4px; width:100%; margin-bottom:15px;" onclick="exportPorthubSave()">1. Download My Save File</button>

        <button style="background:#2f2f37; color:#fff; border:1px solid #444; padding:10px 15px; font-weight:bold; cursor:pointer; border-radius:4px; width:100%;" onclick="document.getElementById('porthubImportFile').click()">2. Upload & Inject Save File</button>

<script>
    function exportPorthubSave() {
    var databases = ['/idbfs', 'EmscriptenFS', 'hollow_knight'];
    var found = false;
    databases.forEach(function(dbName) {
        var request = indexedDB.open(dbName);
        request.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('FILE_DATA')) return;
            db.transaction('FILE_DATA','readonly').objectStore('FILE_DATA').openCursor().onsuccess = function(evt) {
                var cursor = evt.target.result;
                if (cursor) {
                    if (cursor.key.includes('user') || cursor.key.includes('.dat')) {
                        found = true;
                        var rawData = cursor.value.contents ? cursor.value.contents : cursor.value;
                        var blob = new Blob([new Uint8Array(rawData)], {type: "application/octet-stream"});
                        var link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = "hollow_knight_progress.pHubSave";
                        link.click();
                        alert("Success! Your save file has been downloaded to your Downloads folder.");
                    } else {
                    cursor.continue();
                    }
                }
            };
        };
    });
    setTimeout(function() { if(!found) alert("No save data found yet. Try entering the game, saving somewhere, and trying again."); }, 1000);
}

function importPorthubSave(input) {
    if (!input.files || !input.files[0]) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var bytes = new Uint8Array(e.target.result);
        var databases = ['/idbfs', 'EmscriptenFS', 'hollow_knight'];
        var successCount = 0;
        databases.forEach(function(dbName) {
            var request = indexedDB.open(dbName);
            request.onsuccess = function(evt) {
                var db = evt.target.result;
                if (!db.objectStoreNames.contains('FILE_DATA')) return;
                var tx = db.transaction('FILE_DATA', 'readwrite');
                tx.objectStore('FILE_DATA').put({ contents: bytes, timestamp: Date.now() }, '/user1.dat');
                tx.objectStore('FILE_DATA').put({ contents: bytes, timestamp: Date.now() }, 'user1.dat');
                successCount++;
                if(successCount === 1) {
                    alert("Save Injected Successfully! Close the app and reopen it to load your progress.");
                }
            };
        });
    };
    reader.readAsArrayBuffer(input.files[0]);
}
</script>

        <script>
document.addEventListener('keydown', function(event) {
    if (event.key === 'F11' || event.code === 'F11') {
        if (!document.fullscreenElement) {
            triggerTrueBorderless();
        }
    }
});

window.addEventListener('resize', function() {
    if (window.outerWidth === screen.width && window.outerHeight === screen.height) {
        if (!document.fullscreenElement) {
            triggerTrueBorderless();
        }
    }
});

function triggerTrueBorderless() {
    var elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log(err));
    } else if (elem.webkitRequestFullscreen) { 
        elem.webkitRequestFullscreen();
    }
}
</script>
        
<script>


    // Verification patch for your main dashboard script
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then((isPersisted) => {
    const statusDiv = document.getElementById("storage-status");
    
    if (isPersisted) {
      statusDiv.innerText = "Saves Protected (ChromeOS Wipes Blocked)";
      statusDiv.style.color = "#00ff00"; // Green color
    } else {
      // If it's not active yet, request it natively
      navigator.storage.persist().then((granted) => {
        if (granted) {
          statusDiv.innerText = "Saves Protected (ChromeOS Wipes Blocked)";
          statusDiv.style.color = "#00ff00";
        } else {
          statusDiv.innerText = "Saves Vulnerable (Managed Profile Restriction)";
          statusDiv.style.color = "#ff3333"; // Red color
        }
      });
    }
  });
}

</script>
<!-- PORTHUB XBOX INPUT INJECTION BRIDGE -->
<script>
    (function() {
        // 1. Assign stick movements to default arrow key values
        const ENGINE_KEYS = {
            up: 'ArrowUp',
            down: 'ArrowDown',
            left: 'ArrowLeft',
            right: 'ArrowRight'
        };

        let activeKeys = {};

        function sendHardwareKey(code, isPressed) {
            // Stop repeated spam if the key state hasn't changed
            if (activeKeys[code] === isPressed) return;
            activeKeys[code] = isPressed;

            const type = isPressed ? 'keydown' : 'keyup';
            window.dispatchEvent(new KeyboardEvent(type, {
                code: code,
                key: code,
                bubbles: true,
                cancelable: true
            }));
        }

        function pollXboxHardwareBridge() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = gamepads[0]; // Listen directly to your primary Xbox controller slot

            if (pad) {
                // XInput Standard: Axis 2 is Right Stick Horizontal, Axis 3 is Right Stick Vertical
                const axisX = pad.axes[2]; 
                const axisY = pad.axes[3]; 
                const deadzone = 0.25; // Block stick drift

                // Horizontal Panning (Turn Left / Right)
                sendHardwareKey(ENGINE_KEYS.right, axisX > deadzone);
                sendHardwareKey(ENGINE_KEYS.left, axisX < -deadzone);

                // Vertical Pitching (Look Up / Down)
                sendHardwareKey(ENGINE_KEYS.down, axisY > deadzone);
                sendHardwareKey(ENGINE_KEYS.up, axisY < -deadzone);
            }
            requestAnimationFrame(pollXboxHardwareBridge);
        }

        requestAnimationFrame(pollXboxHardwareBridge);
    })();
</script>
